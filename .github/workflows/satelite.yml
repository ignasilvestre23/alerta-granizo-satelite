name: Satélite
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: satelite
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: satelite/requirements.txt
      - run: pip install -r satelite/requirements.txt h5py
      - run: python satelite/satellite_job.py
        env:
          SUPABASE_URL: https://iivmcfpsuvdhsbfqqzzd.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
